site_name: ChatSite 文档
site_description: ChatArch site-workflow package scaffold
site_url: https://arch.gh.wzhecnu.cn/ChatSite/
repo_url: https://github.com/ChatArch/ChatSite
repo_name: ChatArch/ChatSite
edit_uri: edit/main/docs/
docs_dir: docs/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatSite 文档
        - locale: en
          name: English
          build: true
          site_name: ChatSite Documentation
          nav_translations:
            首页: Home
            CLI 树: CLI Tree
            Overleaf 编辑器: Overleaf Editor

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  alternate:
    - name: 中文
      link: /ChatSite/
      lang: zh
    - name: English
      link: /ChatSite/en/
      lang: en

nav:
  - 首页: index.md
  - CLI 树: cli-tree.md
  - Overleaf 编辑器: overleaf-editor-web.md
