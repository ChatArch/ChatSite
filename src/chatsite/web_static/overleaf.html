<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatSite · Overleaf 编辑器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="loginView" class="login-view">
    <section class="login-card">
      <div class="corner-actions">
        <button id="languageToggleLogin" class="ghost" type="button">EN</button>
      </div>
      <p class="eyebrow" data-i18n="featureEyebrow">ChatSite 功能</p>
      <h1 data-i18n="loginTitle">Overleaf 编辑工作台</h1>
      <p class="lede" data-i18n="loginLede">通过 ChatOL 连接 Overleaf：列出项目、编辑 TeX 文件、保存到实时协作通道，并编译 PDF/log 输出。</p>
      <form id="loginForm" class="stack">
        <label><span data-i18n="emailLabel">邮箱</span><input id="loginEmail" type="email" autocomplete="username"></label>
        <label><span data-i18n="passwordLabel">密码</span><input id="loginPassword" type="password" autocomplete="current-password"></label>
        <button class="primary" type="submit" data-i18n="enterWorkspace">进入工作区</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>
  </main>

  <main id="appView" class="app-view hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="featureRoute">ChatSite / Overleaf</p>
        <h1 data-i18n="appTitle">对话式 LaTeX 编辑</h1>
      </div>
      <div class="top-actions">
        <button id="languageToggle" class="ghost" type="button">EN</button>
        <a class="ghost nav-link" href="/" data-i18n="homeLink">ChatSite 首页</a>
        <span id="userBadge" class="badge"></span>
        <button id="settingsButton" class="ghost" type="button" data-i18n="settingsButton">设置</button>
        <button id="logoutButton" class="ghost" type="button" data-i18n="logoutButton">退出</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="rail">
        <div class="panel-title">
          <span data-i18n="conversationsTitle">对话</span>
          <button id="newConversationButton" class="mini" type="button" data-i18n="newButton">新建</button>
        </div>
        <div id="conversationList" class="list compact-list"></div>

        <div class="panel-title projects-title">
          <span data-i18n="projectsTitle">项目</span>
          <button id="refreshProjectsButton" class="mini" type="button" data-i18n="refreshButton">刷新</button>
        </div>
        <div id="projectList" class="list project-list"></div>

        <div class="panel-title projects-title">
          <span data-i18n="casesTitle">实际案例</span>
        </div>
        <div class="list case-list">
          <button id="caseOpenSmoke" type="button"><span data-i18n="caseOpenSmoke">打开 Smoke Test 的 main.tex</span><small data-i18n="caseOpenSmokeMeta">加载示例项目和 TeX 源文件</small></button>
          <button id="caseCompileSmoke" type="button"><span data-i18n="caseCompileSmoke">编译 Smoke Test</span><small data-i18n="caseCompileSmokeMeta">运行编译并预览 PDF/log 链接</small></button>
          <button id="casePromptEdit" type="button"><span data-i18n="casePromptEdit">填入编辑提示</span><small data-i18n="casePromptEditMeta">准备一个可运行的对话案例</small></button>
        </div>
        <p id="caseStatus" class="muted"></p>
      </aside>

      <section class="chat-panel">
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="chat-form">
          <textarea id="chatInput" rows="3" data-i18n-placeholder="chatPlaceholder" placeholder="让 ChatSite 检查、编辑或编译当前 Overleaf 文件……"></textarea>
          <button class="primary" type="submit" data-i18n="sendButton">发送</button>
        </form>
      </section>

      <aside class="editor-panel">
        <div class="panel-title">
          <span data-i18n="fileEditorTitle">文件编辑器</span>
          <button id="compileButton" class="mini" type="button" data-i18n="compileButton">编译</button>
        </div>
        <div class="select-row">
          <select id="fileSelect"><option value="" data-i18n="selectProjectFirst">请先选择项目</option></select>
          <button id="reloadFileButton" class="mini" type="button" data-i18n="reloadButton">重载</button>
        </div>
        <textarea id="editor" class="editor" spellcheck="false" data-i18n-placeholder="editorPlaceholder" placeholder="从项目列表打开一个 TeX 文件。"></textarea>
        <div class="editor-actions">
          <span id="fileStatus" class="muted" data-i18n="noFileSelected">尚未选择文件</span>
          <button id="saveFileButton" class="primary" type="button" data-i18n="saveButton">保存到 Overleaf</button>
        </div>
        <div id="compileStatus" class="compile-status"></div>
        <iframe id="pdfFrame" class="pdf-frame hidden" title="Compiled PDF preview"></iframe>
      </aside>
    </section>
  </main>

  <dialog id="settingsDialog" class="settings-dialog">
    <form id="settingsForm" method="dialog" class="settings-card">
      <div class="panel-title">
        <div>
          <p class="eyebrow" data-i18n="connectionEyebrow">连接设置</p>
          <h2 data-i18n="settingsTitle">Overleaf 与模型访问</h2>
        </div>
        <button id="closeSettingsButton" class="ghost" type="button" data-i18n="closeButton">关闭</button>
      </div>
      <label><span data-i18n="overleafEndpointLabel">Overleaf 入口</span><input id="settingOverleafBaseUrl" placeholder="http://127.0.0.1:8090"></label>
      <label><span data-i18n="overleafEmailLabel">Overleaf 邮箱</span><input id="settingOverleafEmail" type="email"></label>
      <label><span data-i18n="overleafPasswordLabel">Overleaf 密码</span><input id="settingOverleafPassword" type="password" data-i18n-placeholder="keepSecretPlaceholder" placeholder="留空表示保留当前 secret"></label>
      <label><span data-i18n="sessionCookieLabel">Session cookie</span><input id="settingOverleafSession" type="password" data-i18n-placeholder="optionalSecretPlaceholder" placeholder="可选；留空表示保留当前 secret"></label>
      <label><span data-i18n="cookieNameLabel">Cookie 名称</span><input id="settingOverleafCookieName" placeholder="overleaf_session2"></label>
      <label><span data-i18n="modelLabel">OpenAI 模型</span><input id="settingOpenAIModel" placeholder="gpt-5.5"></label>
      <label><span data-i18n="openaiKeyLabel">OpenAI API key</span><input id="settingOpenAIKey" type="password" data-i18n-placeholder="keepSecretPlaceholder" placeholder="留空表示保留当前 secret"></label>
      <div class="secret-row">
        <span id="secretSummary" class="muted"></span>
        <button id="testOverleafButton" class="mini" type="button" data-i18n="testOverleafButton">测试 Overleaf</button>
      </div>
      <button class="primary" type="submit" data-i18n="saveSettingsButton">保存设置</button>
      <p id="settingsStatus" class="muted"></p>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
