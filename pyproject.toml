[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatSite"
dynamic = ["version"]
description = "ChatSite web and service entry point for ChatArch features."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0,<9.0",
    "chatstyle>=0.2.0,<0.3.0",
    "chatenv>=0.2.10,<0.3.0",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatsite", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatSite"
Repository = "https://github.com/ChatArch/ChatSite"
Documentation = "https://arch.gh.wzhecnu.cn/ChatSite/"

[project.scripts]
chatsite = "chatsite.cli:main"
chatsite-web = "chatsite.web:main"

[project.entry-points."chatenv.configs"]
chatsite = "chatsite.config"
chatsite_todo = "chatsite.todo_config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]
overleaf = ["ChatOL>=0.1.2,<0.2.0"]
todo = ["ChatTodo>=0.1.0,<0.2.0", "ChatLogin[web]>=0.1.2,<0.2.0", "fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0", "httpx>=0.27,<1.0"]

[tool.setuptools.dynamic]
version = {attr = "chatsite.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
chatsite = ["web_static/*", "todo_static/*", "todo_static/fonts/*", "todo_static/vendor/*"]
