name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  todo-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/todo/package-lock.json
      - name: Install locked Todo frontend dependencies
        working-directory: frontend/todo
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Test, rebuild, and verify Todo frontend
        working-directory: frontend/todo
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run check
      - run: git diff --exit-code -- src/chatsite/todo_static
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs,overleaf,todo,image-web]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pytest -q
      - run: node --test tests/image_static.test.mjs
      - run: chatsite --version
      - run: chatsite --tree
      - run: chatsite --tree-brief
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import chatsite; assert 'site-packages' in chatsite.__file__, chatsite.__file__; print(chatsite.__file__)"
        working-directory: /
      - run: chatsite --version
      - run: chatsite --tree
      - run: chatsite --tree-brief
      - run: mkdocs build --strict
